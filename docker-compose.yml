version: '3.8'

services:
  db:
    image: postgres:15
    container_name: events_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: events_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: events
      JWT_SECRET: localsecret
      JWT_EXPIRES_IN: 3600s
      FRONTEND_URL: http://localhost:5173
      PORT: 3000
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: events_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  pgdata:
